<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSteamer — Live Football</title>
<meta name="theme-color" content="#0b1a0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0b1a0f; color: #e7f5ea;
    min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    max-width: 720px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; }
  h1 { font-size: 1.3rem; }
  h1 span { color: #4ade80; }
  #refresh { border: 0; background: #11251a; color: #4ade80; padding: 8px 14px; border-radius: 10px; font-size: .9rem; }
  #status { padding: 6px 2px 12px; font-size: .9rem; color: #9fc7a8; min-height: 2em; }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; display: none; margin-bottom: 12px; }
  video.live { display: block; }
  #nowplaying { display: none; font-size: .95rem; padding-bottom: 16px; color: #9fc7a8; }
  .controls { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
  .controls input, .controls select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2a4a33;
    background: #11251a; color: inherit; font-size: 16px;
  }
  .row { display: flex; gap: 8px; }
  .row select { flex: 1; min-width: 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .chip {
    border: 1px solid #2a4a33; background: #11251a; color: #9fc7a8;
    padding: 6px 14px; border-radius: 999px; font-size: .85rem; white-space: nowrap;
  }
  .chip.on { background: #16a34a; border-color: #16a34a; color: #fff; }
  .match {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px; margin-bottom: 8px; background: #11251a; border: 1px solid transparent;
    border-radius: 12px; color: inherit; font-size: .95rem; cursor: pointer;
  }
  .match:active { opacity: .8; }
  .match.playing { border-color: #16a34a; }
  .match img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
  .teams { flex: 1; min-width: 0; }
  .teams div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .league { font-size: .75rem; color: #6b9d77; }
  .meta { text-align: right; flex-shrink: 0; font-size: .85rem; }
  .score { font-weight: 700; font-size: 1rem; }
  .badge { color: #f87171; font-weight: 600; }
  .badge.dim { color: #6b9d77; font-weight: 400; }
</style>
</head>
<body>
<header>
  <h1>⚽ F<span>Steamer</span></h1>
  <button id="refresh">↻ Refresh</button>
</header>
<video id="player" controls playsinline></video>
<p id="nowplaying"></p>
<div class="controls">
  <input id="search" type="search" placeholder="Search teams or leagues…" autocomplete="off">
  <div class="chips" id="statusChips">
    <button class="chip on" data-v="">All</button>
    <button class="chip" data-v="Live">🔴 Live</button>
    <button class="chip" data-v="Upcoming">Upcoming</button>
    <button class="chip" data-v="Finished">Finished</button>
  </div>
  <div class="row">
    <select id="league"><option value="">All leagues</option></select>
    <select id="sort">
      <option value="status">Sort: Live first</option>
      <option value="time">Sort: Kickoff time</option>
      <option value="league">Sort: League</option>
    </select>
  </div>
</div>
<p id="status">Loading matches…</p>
<div id="matches"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const HOST = 'football-live-stream-api.p.rapidapi.com';
const KEY = 'df04a1df80msh5716b2c3304634cp1fddd4jsn8c59795cd4c0';
const HEADERS = { 'x-rapidapi-host': HOST, 'x-rapidapi-key': KEY };
const $ = id => document.getElementById(id);
let hls, all = [], filters = { q: '', status: '', league: '', sort: 'status' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

function render() {
  let list = all.filter(m =>
    (!filters.status || m.status === filters.status) &&
    (!filters.league || m.league === filters.league) &&
    (!filters.q || `${m.home_name} ${m.away_name} ${m.league}`.toLowerCase().includes(filters.q))
  );
  const order = { Live: 0, Upcoming: 1, Finished: 2 };
  list.sort((a, b) =>
    filters.sort === 'time' ? (a.kickoff || '').localeCompare(b.kickoff || '') :
    filters.sort === 'league' ? a.league.localeCompare(b.league) || (a.kickoff || '').localeCompare(b.kickoff || '') :
    (order[a.status] ?? 3) - (order[b.status] ?? 3) || (a.kickoff || '').localeCompare(b.kickoff || '')
  );
  $('matches').innerHTML = list.map(m => `
    <button class="match" data-id="${esc(m.id)}" data-title="${esc(m.home_name)} vs ${esc(m.away_name)}">
      <img src="${esc(m.home_flag)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="teams">
        <div>${esc(m.home_name)}</div>
        <div>${esc(m.away_name)}</div>
        <div class="league">${esc(m.league)}</div>
      </div>
      <div class="meta">
        ${m.status === 'Live'
          ? `<div class="score">${esc(m.score)}</div><div class="badge">● ${esc(m.currentMinutes ?? '')}′</div>`
          : m.status === 'Finished'
          ? `<div class="score">${esc(m.score)}</div><div class="badge dim">FT · ${esc((m.kickoff || '').slice(5, 10))}</div>`
          : `<div>${esc((m.kickoff || '').slice(11, 16))}</div><div class="badge dim">${esc((m.kickoff || '').slice(5, 10))}</div>`}
      </div>
    </button>`).join('') || '<p id="empty" style="color:#6b9d77">No matches found.</p>';
  const live = all.filter(m => m.status === 'Live').length;
  $('status').textContent = all.length ? `${live} live · showing ${list.length} of ${all.length} matches` : 'No matches right now.';
}

async function loadMatches() {
  $('status').textContent = 'Loading matches…';
  try {
    const res = await fetch(`https://${HOST}/all-match`, { headers: HEADERS });
    all = (await res.json()).result || [];
    const leagues = [...new Set(all.map(m => m.league))].sort();
    $('league').innerHTML = '<option value="">All leagues</option>' +
      leagues.map(l => `<option${l === filters.league ? ' selected' : ''}>${esc(l)}</option>`).join('');
    render();
  } catch {
    $('status').textContent = 'Failed to load matches. Tap refresh to retry.';
  }
}

function stop(msg) {
  if (hls) { hls.destroy(); hls = null; }
  $('player').classList.remove('live');
  $('nowplaying').style.display = 'none';
  if (msg) $('status').textContent = msg;
}

async function play(id, title, el) {
  stop();
  $('status').textContent = `Fetching stream for ${title}…`;
  document.querySelectorAll('.match.playing').forEach(b => b.classList.remove('playing'));
  try {
    const res = await fetch(`https://${HOST}/link/${encodeURIComponent(id)}`, { headers: HEADERS });
    const { url } = await res.json();
    if (!url) { $('status').textContent = 'No stream available for this match.'; return; }

    // Some finished/ended matches return a dead placeholder playlist — detect it
    try {
      const m3u8 = await (await fetch(url)).text();
      const media = m3u8.match(/^[^#].*\.m3u8.*$/m);
      const sub = media ? await (await fetch(new URL(media[0], url))).text() : m3u8;
      if (/#EXT-X-TARGETDURATION:0\b/.test(sub) || !/#EXTINF:[1-9]/.test(sub)) {
        $('status').textContent = 'Stream has ended — replay not available for this match.';
        return;
      }
    } catch {} // CORS or fetch failure: let the player try anyway

    const video = $('player');
    video.classList.add('live');
    el.classList.add('playing');
    if (video.canPlayType('application/vnd.apple.mpegurl')) { // iOS native HLS
      video.src = url;
      video.play().catch(() => {});
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else stop('Stream failed to play. Try another match.');
      });
    } else {
      video.src = url;
      video.play().catch(() => {});
    }
    $('nowplaying').style.display = 'block';
    $('nowplaying').textContent = `🔴 ${title}`;
    $('status').textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch {
    $('status').textContent = 'Failed to load stream. Try again.';
  }
}

$('matches').onclick = e => {
  const btn = e.target.closest('.match');
  if (btn) play(btn.dataset.id, btn.dataset.title, btn);
};
$('refresh').onclick = loadMatches;
$('search').oninput = e => { filters.q = e.target.value.trim().toLowerCase(); render(); };
$('league').onchange = e => { filters.league = e.target.value; render(); };
$('sort').onchange = e => { filters.sort = e.target.value; render(); };
$('statusChips').onclick = e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filters.status = chip.dataset.v;
  document.querySelectorAll('#statusChips .chip').forEach(c => c.classList.toggle('on', c === chip));
  render();
};
loadMatches();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
