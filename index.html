<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FSteamer — Live Football</title>
  <meta name="theme-color" content="#0b1a0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0b1a0f;
      color: #e7f5ea;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px 32px;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.3rem;
    }

    h1 span {
      color: #4ade80;
    }

    #refresh {
      border: 0;
      background: #11251a;
      color: #4ade80;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: .9rem;
    }

    .status {
      padding: 6px 2px 12px;
      font-size: .9rem;
      color: #9fc7a8;
      min-height: 2em;
    }

    video {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      display: none;
      margin-bottom: 12px;
    }

    video.live {
      display: block;
    }

    #nowplaying {
      display: none;
      font-size: .95rem;
      padding-bottom: 16px;
      color: #9fc7a8;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2a4a33;
      background: #11251a;
      color: inherit;
      font-size: 16px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row select {
      flex: 1;
      min-width: 0;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chip {
      border: 1px solid #2a4a33;
      background: #11251a;
      color: #9fc7a8;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .85rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.on {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }

    #tabs {
      padding-bottom: 12px;
    }

    .tab {
      display: none;
    }

    .tab.on {
      display: block;
    }

    .match {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px;
      margin-bottom: 8px;
      background: #11251a;
      border: 1px solid transparent;
      border-radius: 12px;
      color: inherit;
      font-size: .95rem;
      cursor: pointer;
    }

    .match:active {
      opacity: .8;
    }

    .match.playing {
      border-color: #16a34a;
    }

    .match img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .teams {
      flex: 1;
      min-width: 0;
    }

    .teams div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .league {
      font-size: .75rem;
      color: #6b9d77;
    }

    .meta {
      text-align: right;
      flex-shrink: 0;
      font-size: .85rem;
    }

    .score {
      font-weight: 700;
      font-size: 1rem;
    }

    .badge {
      color: #f87171;
      font-weight: 600;
    }

    .badge.dim {
      color: #6b9d77;
      font-weight: 400;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }

    th,
    td {
      padding: 8px 6px;
      text-align: right;
      border-bottom: 1px solid #1c3424;
    }

    th {
      color: #6b9d77;
      font-weight: 600;
      font-size: .75rem;
      text-transform: uppercase;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
      width: 99%;
    }

    td:first-child {
      color: #6b9d77;
    }

    .player {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      margin-bottom: 8px;
      background: #11251a;
      border-radius: 12px;
      font-size: .95rem;
    }

    .player small {
      color: #6b9d77;
    }

    #installBanner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #11251a;
      border: 1px solid #1d3b28;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: .85rem;
    }

    #installBanner[hidden] {
      display: none;
    }

    #installMsg {
      flex: 1;
    }

    #installBtn {
      border: 0;
      background: #4ade80;
      color: #0b1a0f;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      white-space: nowrap;
    }

    #installDismiss {
      border: 0;
      background: none;
      color: #6b9d77;
      font-size: 1rem;
      padding: 4px;
    }
  </style>
</head>

<body>
  <header>
    <h1>⚽ F<span>Steamer</span></h1>
    <button id="refresh">↻ Refresh</button>
  </header>

  <div id="installBanner" hidden>
    <span id="installMsg">Install FSteamer for full-screen play and offline access.</span>
    <button id="installBtn">Install</button>
    <button id="installDismiss">✕</button>
  </div>

  <div class="chips" id="tabs">
    <button class="chip on" data-t="matches">Matches</button>
    <button class="chip" data-t="standings">Standings</button>
    <button class="chip" data-t="players">Players</button>
  </div>

  <section id="tab-matches" class="tab on">
    <video id="player" controls playsinline></video>
    <p id="nowplaying"></p>
    <div class="controls">
      <input id="search" type="search" placeholder="Search teams or leagues…" autocomplete="off">
      <div class="chips" id="statusChips">
        <button class="chip on" data-v="">All</button>
        <button class="chip" data-v="Live">🔴 Live</button>
        <button class="chip" data-v="Upcoming">Upcoming</button>
        <button class="chip" data-v="Finished">Finished</button>
      </div>
      <div class="row">
        <select id="league">
          <option value="">All leagues</option>
        </select>
        <select id="sort">
          <option value="status">Sort: Live first</option>
          <option value="time">Sort: Kickoff time</option>
          <option value="league">Sort: League</option>
        </select>
      </div>
    </div>
    <p id="status" class="status">Loading matches…</p>
    <div id="matches"></div>
  </section>

  <section id="tab-standings" class="tab">
    <div class="controls">
      <select id="standLeague"></select>
    </div>
    <p id="standStatus" class="status"></p>
    <div id="standings"></div>
  </section>

  <section id="tab-players" class="tab">
    <div class="controls">
      <input id="playerQ" type="search" placeholder="Search players or coaches… (press Enter)" autocomplete="off">
    </div>
    <p id="playerStatus" class="status"></p>
    <div id="players"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
    // API keys live server-side in the Cloudflare Worker proxy (worker/).
    // Streams come from football-live-stream-api; scores, standings and
    // players come from free-api-live-football-data as a richer fallback.
    const API = 'https://fsteamer-proxy.shamodoro-services.workers.dev';
    const $ = id => document.getElementById(id);
    let hls, all = [], linkCache = {}, filters = { q: '', status: '', league: '', sort: 'status' };

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

    async function api(path) {
      const res = await fetch(`${API}${path}`);
      const data = await res.json();
      if (!res.ok || data.message) throw new Error(data.message || `HTTP ${res.status}`);
      return data;
    }

    // ---------- Tabs ----------
    $('tabs').onclick = e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#tabs .chip').forEach(c => c.classList.toggle('on', c === chip));
      document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === `tab-${chip.dataset.t}`));
      if (chip.dataset.t === 'standings' && !$('standLeague').options.length) loadLeagues();
    };

    // ---------- Matches ----------
    function render() {
      let list = all.filter(m =>
        (!filters.status || m.status === filters.status) &&
        (!filters.league || m.league === filters.league) &&
        (!filters.q || `${m.home_name} ${m.away_name} ${m.league}`.toLowerCase().includes(filters.q))
      );
      const order = { Live: 0, Upcoming: 1, Finished: 2 };
      list.sort((a, b) =>
        filters.sort === 'time' ? (a.kickoff || '').localeCompare(b.kickoff || '') :
          filters.sort === 'league' ? (a.league || '').localeCompare(b.league || '') || (a.kickoff || '').localeCompare(b.kickoff || '') :
            (order[a.status] ?? 3) - (order[b.status] ?? 3) || (a.kickoff || '').localeCompare(b.kickoff || '')
      );
      $('matches').innerHTML = list.map((m, i) => `
        <button class="match" data-i="${all.indexOf(m)}">
          ${m.home_flag ? `<img src="${esc(m.home_flag)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''}
          <div class="teams">
            <div>${esc(m.home_name)}</div>
            <div>${esc(m.away_name)}</div>
            <div class="league">${esc(m.league)}</div>
          </div>
          <div class="meta">
            ${m.status === 'Live'
          ? `<div class="score">${esc(m.score)}</div><div class="badge">● ${esc(m.currentMinutes ?? '')}′</div>`
          : m.status === 'Finished'
            ? `<div class="score">${esc(m.score)}</div><div class="badge dim">FT · ${esc((m.kickoff || '').slice(5, 10))}</div>`
            : `<div>${esc((m.kickoff || '').slice(11, 16))}</div><div class="badge dim">${esc((m.kickoff || '').slice(5, 10))}</div>`}
          </div>
        </button>`).join('') || '<p class="status">No matches found.</p>';
      const live = all.filter(m => m.status === 'Live').length;
      $('status').textContent = all.length ? `${live} live · showing ${list.length} of ${all.length} matches` : 'No matches right now.';
    }

    function setMatches(list) {
      all = list;
      const leagues = [...new Set(all.map(m => m.league).filter(Boolean))].sort();
      $('league').innerHTML = '<option value="">All leagues</option>' +
        leagues.map(l => `<option${l === filters.league ? ' selected' : ''}>${esc(l)}</option>`).join('');
      render();
    }

    // Fallback source: live-data API, mapped to the stream API's match shape
    const mapData = m => ({
      src: 'data',
      home_name: m.home?.longName || m.home?.name,
      away_name: m.away?.longName || m.away?.name,
      league: m.leagueName || '',
      score: `${m.home?.score ?? 0} - ${m.away?.score ?? 0}`,
      status: m.status?.finished ? 'Finished' : m.status?.started ? 'Live' : 'Upcoming',
      kickoff: m.status?.utcTime || '',
      currentMinutes: m.status?.liveTime?.short?.replace(/[^\d+]/g, '') || '',
    });

    async function loadDataMatches() {
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const [live, byDate] = await Promise.allSettled([
        api('/data/football-current-live'),
        api(`/data/football-get-matches-by-date?date=${today}`),
      ]);
      const liveList = live.value?.response?.live || [];
      const dayList = byDate.value?.response?.matches || [];
      const liveIds = new Set(liveList.map(m => m.id));
      return [...liveList, ...dayList.filter(m => !liveIds.has(m.id))].map(mapData);
    }

    // The free plans allow ~50 requests/day each, so reuse the match list
    // for 5 minutes unless the user forces a refresh.
    const TTL = 5 * 60 * 1000;

    async function loadMatches(force = false) {
      const cached = JSON.parse(localStorage.getItem('matches') || 'null');
      if (!force && cached?.at && Date.now() - cached.at < TTL) {
        setMatches(cached.list);
        const age = Math.round((Date.now() - cached.at) / 60000);
        $('status').textContent += ` · cached ${age ? age + 'm ago' : 'just now'}`;
        return;
      }
      $('status').textContent = 'Loading matches…';
      try {
        const data = await api('/all-match');
        const list = data.result || [];
        localStorage.setItem('matches', JSON.stringify({ at: Date.now(), list }));
        setMatches(list);
      } catch (streamErr) {
        try { // stream API quota hit or unsubscribed: rotate to the data API
          const list = await loadDataMatches();
          localStorage.setItem('matches', JSON.stringify({ at: Date.now(), list }));
          setMatches(list);
          $('status').textContent += ' · live-data source (streams may be unavailable)';
        } catch {
          if (cached?.list?.length) setMatches(cached.list);
          $('status').textContent = `API error: ${streamErr.message}${cached?.list?.length ? ' — showing last known matches.' : ''}`;
        }
      }
    }

    function stop(msg) {
      if (hls) { hls.destroy(); hls = null; }
      $('player').classList.remove('live');
      $('nowplaying').style.display = 'none';
      if (msg) $('status').textContent = msg;
    }

    async function play(m, el) {
      stop();
      const title = `${m.home_name} vs ${m.away_name}`;
      document.querySelectorAll('.match.playing').forEach(b => b.classList.remove('playing'));
      if (m.src === 'data') {
        $('status').textContent = 'No stream for this match — the stream API is unavailable right now.';
        return;
      }
      $('status').textContent = `Fetching stream for ${title}…`;
      try {
        let url = linkCache[m.id];
        if (!url) {
          const data = await api(`/link/${encodeURIComponent(m.id)}`);
          url = data.url;
          if (url) linkCache[m.id] = url;
        }
        if (!url) { $('status').textContent = 'No stream available for this match.'; return; }

        // Some finished/ended matches return a dead placeholder playlist — detect it
        try {
          const m3u8 = await (await fetch(url)).text();
          const media = m3u8.match(/^[^#].*\.m3u8.*$/m);
          const sub = media ? await (await fetch(new URL(media[0], url))).text() : m3u8;
          if (/#EXT-X-TARGETDURATION:0\b/.test(sub) || !/#EXTINF:[1-9]/.test(sub)) {
            $('status').textContent = 'Stream has ended — replay not available for this match.';
            return;
          }
        } catch { } // CORS or fetch failure: let the player try anyway

        const video = $('player');
        video.classList.add('live');
        el.classList.add('playing');
        if (video.canPlayType('application/vnd.apple.mpegurl')) { // iOS native HLS
          video.src = url;
          video.play().catch(() => { });
        } else if (window.Hls && Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => { }));
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else stop('Stream failed to play. Try another match.');
          });
        } else {
          video.src = url;
          video.play().catch(() => { });
        }
        $('nowplaying').style.display = 'block';
        $('nowplaying').textContent = `🔴 ${title}`;
        $('status').textContent = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        $('status').textContent = `Failed to load stream: ${err.message}`;
      }
    }

    $('matches').onclick = e => {
      const btn = e.target.closest('.match');
      if (btn) play(all[+btn.dataset.i], btn);
    };
    $('refresh').onclick = () => loadMatches(true);
    $('search').oninput = e => { filters.q = e.target.value.trim().toLowerCase(); render(); };
    $('league').onchange = e => { filters.league = e.target.value; render(); };
    $('sort').onchange = e => { filters.sort = e.target.value; render(); };
    $('statusChips').onclick = e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      filters.status = chip.dataset.v;
      document.querySelectorAll('#statusChips .chip').forEach(c => c.classList.toggle('on', c === chip));
      render();
    };

    // ---------- Standings ----------
    async function loadLeagues() {
      $('standStatus').textContent = 'Loading leagues…';
      try {
        const data = await api('/data/football-get-all-leagues-with-countries');
        $('standLeague').innerHTML = (data.response?.leagues || []).map(c =>
          `<optgroup label="${esc(c.name)}">${c.leagues.map(l =>
            `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
        const wc = [...$('standLeague').options].find(o => /world cup/i.test(o.text) && !/qual|u\d|women|club/i.test(o.text));
        $('standLeague').value = wc ? wc.value : '47';
        loadStandings($('standLeague').value);
      } catch (err) {
        $('standStatus').textContent = `API error: ${err.message}`;
      }
    }

    async function loadStandings(id) {
      $('standings').innerHTML = '';
      $('standStatus').textContent = 'Loading standings…';
      try {
        const data = await api(`/data/football-get-standing-all?leagueid=${encodeURIComponent(id)}`);
        const rows = data.response?.standing || [];
        if (!rows.length) { $('standStatus').textContent = 'No standings for this competition.'; return; }
        $('standings').innerHTML = `<table>
          <tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
          ${rows.map(r => `<tr><td>${r.idx}</td><td>${esc(r.shortName || r.name)}</td><td>${r.played}</td>
            <td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.goalConDiff > 0 ? '+' : ''}${r.goalConDiff}</td>
            <td><b>${r.pts}</b></td></tr>`).join('')}
        </table>`;
        $('standStatus').textContent = '';
      } catch (err) {
        $('standStatus').textContent = `API error: ${err.message}`;
      }
    }

    $('standLeague').onchange = e => loadStandings(e.target.value);

    // ---------- Players ----------
    async function searchPlayers(q) {
      $('players').innerHTML = '';
      $('playerStatus').textContent = 'Searching…';
      try {
        const data = await api(`/data/football-players-search?search=${encodeURIComponent(q)}`);
        const list = data.response?.suggestions || [];
        $('players').innerHTML = list.map(p => `
          <div class="player">
            <span>${esc(p.name)}${p.isCoach ? ' <small>(coach)</small>' : ''}</span>
            <small>${esc(p.teamName || '')}</small>
          </div>`).join('') || '<p class="status">No players found.</p>';
        $('playerStatus').textContent = list.length ? `${list.length} results` : '';
      } catch (err) {
        $('playerStatus').textContent = `API error: ${err.message}`;
      }
    }

    $('playerQ').onkeydown = e => {
      if (e.key === 'Enter' && e.target.value.trim()) searchPlayers(e.target.value.trim());
    };

    loadMatches();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    // --- Install prompt ---
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const installDismissed = localStorage.getItem('installDismissed');
    let deferredInstall = null;

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstall = e;
      if (!standalone && !installDismissed) $('installBanner').hidden = false;
    });

    // iOS Safari never fires beforeinstallprompt — show manual instructions instead.
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS && !standalone && !installDismissed) {
      $('installMsg').textContent = 'Install FSteamer: tap the Share button, then “Add to Home Screen”.';
      $('installBtn').hidden = true;
      $('installBanner').hidden = false;
    }

    $('installBtn').onclick = async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      $('installBanner').hidden = true;
    };

    $('installDismiss').onclick = () => {
      $('installBanner').hidden = true;
      localStorage.setItem('installDismissed', '1');
    };

    window.addEventListener('appinstalled', () => { $('installBanner').hidden = true; });
  </script>
</body>

</html>
